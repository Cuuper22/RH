name: Lean RS Targeted CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-rs-targeted-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  rs-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Restore Lean project build cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: rh-lean-rs-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rh-lean-rs-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            rh-lean-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            rh-lean-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compile RS main-term bridge
        id: compile
        continue-on-error: true
        run: lake build RH.Zeta85.Discharge.RSMainTermConvergence

      - name: Save partial Lean build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: rh-lean-rs-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}

      - name: Propagate compiler failure
        if: steps.compile.outcome == 'failure'
        run: exit 1
