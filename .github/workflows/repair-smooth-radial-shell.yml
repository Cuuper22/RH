name: Repair Smooth Radial Shell

on:
  push:
    branches:
      - attack/smooth-radial-shell
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-smooth-radial-shell
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out attack branch
        uses: actions/checkout@v4
        with:
          ref: attack/smooth-radial-shell
          fetch-depth: 0

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Restore Lean project build cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: rh-smooth-shell-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rh-smooth-shell-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            rh-lean-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Apply repairs and compile the annular construction
        id: compile
        shell: bash
        run: |
          set +e
          mkdir -p verify
          {
            python verify/repair_smooth_radial_shell.py || exit $?
            lake build RH.Zeta85.Discharge.SmoothRadialShell
          } 2>&1 | tee verify/smooth-radial-shell-ci.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist the compiler verdict
        shell: bash
        run: |
          status='${{ steps.compile.outputs.status }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" = "0" ]; then
            rm -f verify/smooth-radial-shell-ci.log
            git add RH/Zeta85/Discharge/SmoothRadialShell.lean verify/smooth-radial-shell-ci.log
            message="Repair smooth radial-shell construction"
          else
            git add verify/smooth-radial-shell-ci.log
            message="Capture remaining smooth radial-shell compiler blockers"
          fi

          if ! git diff --cached --quiet; then
            git diff --cached --check
            git commit -m "$message"
            git push origin HEAD:attack/smooth-radial-shell
          fi

          exit "$status"
