name: Lean CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Restore Lean project build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            .lake/packages
          key: rh-lean-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rh-lean-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build base and extension headlines
        run: >-
          lake build Zeta23 RH.Zeta85.Main RH.Zeta85.Shiu
          RH.Zeta85.Discharge.LiteralEnergyTailEquivalence
          RH.Zeta85.Discharge.CollectiveEnergyTailRoute
          RH.Zeta85.Discharge.RSRealHeightDiagonal
          RH.Zeta85.Discharge.RSRealHeightFourStage
          RH.Zeta85.Discharge.RSRealHeightFiniteSplit
          Solution Solution.Multiplicity Solution.XiPrime Solution.Zeta85

      - name: Check headline axiom output
        shell: bash
        run: |
          bash verify/check_zeta85_axioms.sh
          sed -n '19,$p' verify/check_axioms.sh | bash -euo pipefail

      - name: Reject proof placeholders outside comparator challenges
        shell: bash
        run: |
          if rg -n '^\s*(sorry|admit)\b|:=\s*(sorry|by\s+sorry)\b|\bby\s+sorry\b' \
            --glob '*.lean' \
            --glob '!comparator/Challenge.lean' \
            --glob '!comparator/Challenge/**' \
            Zeta23 RH comparator; then
            echo 'proof placeholder found outside comparator challenge files' >&2
            exit 1
          fi
