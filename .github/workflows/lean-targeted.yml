name: Lean Targeted CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-targeted-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Restore Lean project build cache
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: rh-lean-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            rh-lean-targeted-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            rh-lean-project-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Compile shell and collective route
        run: >-
          lake build
          RH.Zeta85.Discharge.RadialShellAlias
          RH.Zeta85.Discharge.RadialShellFamily
          RH.Zeta85.Discharge.AggregateSynthesisBridge
          RH.Zeta85.QuarticMain
