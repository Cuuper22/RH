name = "Zeta23"
version = "0.1.0"
defaultTargets = ["Zeta23"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "905b95818eb32af7874a58b427f50c1711a5e96c"

[[lean_lib]]
name = "Zeta23"

# --- comparator challenge/solution layer (comparator/README.md). Trusted: ChallengeDeps + Challenge
# (Mathlib-only). Untrusted: Solution (imports Zeta23). Not in defaultTargets; build with
# `lake build Challenge Solution`, or let github.com/leanprover/comparator build them itself.
[[lean_lib]]
name = "ChallengeDeps"
srcDir = "comparator"

[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
